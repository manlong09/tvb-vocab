    if (saved.unfamiliar) state.unfamiliar = saved.unfamiliar;

    if (saved.speed) state.speed = saved.speed;
    if (saved.fontSize) state.fontSize = saved.fontSize;
    if (typeof saved.darkMode === 'boolean') state.darkMode = saved.darkMode;

      mastered: state.mastered,

      accent: state.accent,
      speed: state.speed,

async function tryLoadExternalData() {
  try {
    const res = await fetch('data/index.json', { cache: 'no-store' });
    if (!res.ok) return;
    const indexList = await res.json();
    if (Array.isArray(indexList) && indexList.length > 0) {
      // 以 data/ 內的真實資料為準，完全取代內置示範資料（示範資料只在無法載入 data/ 時使用）
      const dates = indexList
        .map(entry => (typeof entry === 'string' ? entry : entry?.date))
        .filter(Boolean);
      const results = await Promise.all(dates.map(async d => {
        try {
          const dayRes = await fetch(`data/${d}.json`, { cache: 'no-store' });
          return dayRes.ok ? [d, await dayRes.json()] : null;
        } catch (_) {
          return null;
        }
      }));
      const realDb = Object.fromEntries(results.filter(Boolean));
      if (Object.keys(realDb).length === 0) return;
      state.db = realDb;
      state.availableDates = Object.keys(state.db).sort().reverse();
      state.selectedDate = state.availableDates[0];
      state.calendarMonth = state.selectedDate.slice(0, 7);
      renderAll();
    }
  } catch (_) {}
}

// ==================== 4. SPEECH SYNTHESIS (UK / US TTS) ====================
function speakText(text, forceAccent = null) {
  if (!('speechSynthesis' in window)) {
    showToast('您的瀏覽器不支援語音朗讀功能');
    return;
  }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const acc = forceAccent || state.accent;
  utter.lang = acc === 'uk' ? 'en-GB' : 'en-US';
  utter.rate = state.speed;

  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v =>
    acc === 'uk'
      ? (v.lang === 'en-GB' && (v.name.includes('Daniel') || v.name.includes('Kate') || v.name.includes('Google UK')))
      : (v.lang === 'en-US' && (v.name.includes('Samantha') || v.name.includes('Alex') || v.name.includes('Google US')))
  ) || voices.find(v => v.lang.startsWith(acc === 'uk' ? 'en-GB' : 'en-US'));

  if (preferred) utter.voice = preferred;
  window.speechSynthesis.speak(utter);
}

function escapeHtml(str) {
  if (!str) return '';
  return String(str)

// 在新聞原句中標示目標字詞（粗體＋底色），支援詞形變化、常見不規則動詞及片語
const IRREGULAR_FORMS = {
  be: ['is','are','was','were','been','being'], come: ['came'], go: ['went','gone'], take: ['took','taken'],
  make: ['made'], give: ['gave','given'], get: ['got','gotten'], run: ['ran'], bring: ['brought'],
  keep: ['kept'], hold: ['held'], break: ['broke','broken'], fall: ['fell','fallen'], see: ['saw','seen'],
  rise: ['rose','risen'], draw: ['drew','drawn'], stand: ['stood'], lead: ['led'], catch: ['caught'],
  seek: ['sought'], speak: ['spoke','spoken'], write: ['wrote','written'], drive: ['drove','driven'],
  grow: ['grew','grown'], shake: ['shook','shaken'], strike: ['struck'], sink: ['sank','sunk'],
  deal: ['dealt'], lay: ['laid'], pay: ['paid'], sell: ['sold'], tell: ['told'], think: ['thought'],
  buy: ['bought'], fight: ['fought'], find: ['found'], build: ['built'], send: ['sent'], spend: ['spent'],
  lose: ['lost'], leave: ['left'], meet: ['met'], mean: ['meant'], bear: ['bore','borne'], wear: ['wore','worn'],
  tear: ['tore','torn'], choose: ['chose','chosen'], freeze: ['froze','frozen'], steal: ['stole','stolen'],
  arise: ['arose','arisen'], undertake: ['undertook','undertaken'], withdraw: ['withdrew','withdrawn'],
  overcome: ['overcame'], forgo: ['forwent','forgone'], uphold: ['upheld'], withstand: ['withstood'],
  undergo: ['underwent','undergone'], oversee: ['oversaw','overseen'], swear: ['swore','sworn'], fly: ['flew','flown'],
  vie: ['vying','vied','vies'], lie: ['lying','lay','lain'], tie: ['tying','tied'], die: ['dying','died']
};
const PLACEHOLDER_TOKENS = ['sb','sth','someone','something','somebody','sb.','sth.'];
function escapeRegex(t) { return t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function tokenPattern(tok) {
  const low = tok.toLowerCase();
  if (PLACEHOLDER_TOKENS.includes(low)) return "[\\w'’-]+(?:\\s+[\\w'’-]+){0,3}?";
  if (low === "one's" || low === 'one’s') return "(?:one's|one’s|his|her|their|its|our|my|your)";
  const forms = [];
  let base = low;
  if (base.length > 3 && /[ey]$/.test(base)) base = base.slice(0, -1);
  forms.push(escapeRegex(base) + "[a-z]?(?:s|es|ed|d|ing|ings|ies|ied|er|ers|est|ly|ily|n|en|ment|ments)?");
  (IRREGULAR_FORMS[low] || []).forEach(f => forms.push(escapeRegex(f)));
  return '(?:' + forms.join('|') + ')';
}
function highlightExample(sentence, word, type) {
  if (!sentence) return '';
  const text = String(sentence);
  if (!word || type === 'sentence') return escapeHtml(text);
  const cleaned = String(word).replace(/\([^)]*\)/g, ' ').replace(/[\/…]/g, ' ').trim();
  const tokens = cleaned.split(/[\s-]+/).filter(Boolean);
  if (!tokens.length) return escapeHtml(text);
  const pats = tokens.map(tokenPattern);
  const B = "(?<![A-Za-z])", E = "(?![A-Za-z])";
  // 1) 完整片語；2) 片語中間夾有少量字詞（如 ink an ambitious deal）；3) 只標示片語中的主要字詞
  const tiers = [B + pats.join("[\\s-]+") + E];
  if (pats.length > 1) tiers.push(B + pats.join("(?:[\\s-]+[\\w'’-]+){0,3}?[\\s-]+") + E);
  const STOP = ['the','a','an','to','of','in','on','at','for','with','into','by','up','out','off','and','or','one\'s','sb','sth','someone','something','be'];
  const keys = tokens.filter(t => t.length > 2 && !STOP.includes(t.toLowerCase()));
  if (pats.length > 1 && keys.length) tiers.push(B + '(?:' + keys.map(tokenPattern).join('|') + ')' + E);
  for (const src of tiers) {
    let re;
    try { re = new RegExp(src, 'gi'); } catch (e) { continue; }
    let out = '', last = 0, m, hits = 0;
    while ((m = re.exec(text)) !== null) {
      if (!m[0]) { re.lastIndex++; continue; }
      out += escapeHtml(text.slice(last, m.index)) + '<mark class="ex-hl">' + escapeHtml(m[0]) + '</mark>';
      last = m.index + m[0].length; hits++;
    }
    if (hits) return out + escapeHtml(text.slice(last));
  }
  return escapeHtml(text);
}

// Format headline: Chinese on first line, English in parentheses on a new line
function formatBilingualHeadline(raw) {
  if (!raw) return '';
  const match = raw.match(/^(.*?)\s*\(([^()]+)\)\s*$/);
  if (match) {
    return `
      <div class="font-semibold text-slate-800 dark:text-slate-100 leading-snug break-words">${escapeHtml(match[1].trim())}</div>
      <div class="text-xs text-slate-500 dark:text-slate-400 font-normal mt-0.5 leading-snug break-words">(${escapeHtml(match[2].trim())})</div>
    `;
  }
  return `<div class="font-semibold text-slate-800 dark:text-slate-100 leading-snug break-words">${escapeHtml(raw)}</div>`;
}

function getAllItemsFlattened() {
  const list = [];
  for (const date of state.availableDates) {
    const dayObj = state.db[date];
    if (!dayObj || !Array.isArray(dayObj.items)) continue;
    dayObj.items.forEach((item, idx) => {
      list.push({ ...item, date, idx, uid: `${date}_${idx}` });
    });
  }
  return list;
}

function getWordFrequencyMap() {
  const map = new Map();
  for (const date of state.availableDates) {
    const dayObj = state.db[date];
    if (!dayObj || !Array.isArray(dayObj.items)) continue;
    dayObj.items.forEach((item) => {
      const key = item.word.toLowerCase().trim();
      if (!map.has(key)) {
        map.set(key, {
          word: item.word,
          key,
          pos: item.pos,
          topic_id: item.topic_id,
          band: item.band,
          synonyms: item.synonyms || [],
          zh: item.zh,
          ipa_uk: item.ipa_uk,
          ipa_us: item.ipa_us,
          count: 0,
          latestDate: date,
          dates: []
        });
      }
      const entry = map.get(key);
      entry.count += 1;
      if (!entry.dates.includes(date)) entry.dates.push(date);
      if (date > entry.latestDate) entry.latestDate = date;
    });
  }
  return map;
}

function getUniqueWordStats() {
  return Array.from(getWordFrequencyMap().values());
}

function toggleStatus(word, targetStatus) {
  const key = word.toLowerCase().trim();
  if (targetStatus === 'mastered') {
    if (state.mastered[key]) {
      delete state.mastered[key];
      showToast(`已取消「${word}」的已掌握標記`);
    } else {
      state.mastered[key] = true;
      delete state.unfamiliar[key];
      showToast(`✅ 已將「${word}」標記為已掌握`);
    }
  } else if (targetStatus === 'unfamiliar') {
    if (state.unfamiliar[key]) {
      delete state.unfamiliar[key];
      showToast(`已取消「${word}」的溫習標記`);
    } else {
      state.unfamiliar[key] = true;
      delete state.mastered[key];
      showToast(`📌 已將「${word}」加入溫習詞彙清單`);
    }
  }
  saveState();
  renderAll();
}

    document.querySelectorAll('.sidebar-label').forEach(el => el.classList.remove('hidden'));
  }
}

    return `${controlsHtml}<div class="grid ${gridColsClass} gap-4">${cardsHtml}</div>`;

        <!-- Col 3: Chinese Meaning + Per-Row Blur Toggle (16%) -->
        <td class="py-3.5 px-2.5 w-[16%] break-words">

          <tbody>

          </tbody>
        </table>
      </div>
    </div>
  `;
}

// Mini Calendar Component
function renderMiniCalendar(customTitle = '新聞日曆導航') {
  const [yearStr, monthStr] = state.calendarMonth.split('-');
  const year = parseInt(yearStr, 10);
  const month = parseInt(monthStr, 10);
  const firstDayWeekday = new Date(year, month - 1, 1).getDay();
  const daysInMonth = new Date(year, month, 0).getDate();

  const weekdays = ['日', '一', '二', '三', '四', '五', '六'];
  let cellsHtml = '';

  for (let i = 0; i < firstDayWeekday; i++) {
    cellsHtml += `<div class="h-10"></div>`;
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const dStr = `${yearStr}-${monthStr}-${String(day).padStart(2, '0')}`;
    const hasData = !!state.db[dStr];
    const isSelected = state.selectedDate === dStr;
    const headlineTip = hasData ? (state.db[dStr].headlines?.[0] || '') : '無新聞紀錄';

    if (hasData) {
      cellsHtml += `
        <button onclick="openDateVocab('${dStr}')" title="${escapeHtml(headlineTip)}" class="h-10 rounded-xl flex flex-col items-center justify-center text-xs font-bold transition relative ${
          isSelected
            ? 'bg-indigo-600 text-white shadow-sm'
            : 'bg-indigo-50 dark:bg-indigo-950/70 text-indigo-700 dark:text-indigo-300 hover:bg-indigo-100 dark:hover:bg-indigo-900 border border-indigo-200 dark:border-indigo-800'
        }">
          <span>${day}</span>
          <span class="w-1.5 h-1.5 rounded-full ${isSelected ? 'bg-white' : 'bg-indigo-500'} mt-0.5"></span>
        </button>
      `;
    } else {
      cellsHtml += `
        <div class="h-10 rounded-xl flex items-center justify-center text-xs text-slate-400 dark:text-slate-600">
          ${day}
        </div>
      `;
    }
  }

  return `
    <div class="flex items-center justify-between mb-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">${escapeHtml(customTitle)}</span>
        <h3 class="text-base font-extrabold mt-0.5">🗓️ ${year} 年 ${month} 月</h3>
      </div>
      <div class="flex items-center gap-1">
        <button onclick="changeCalendarMonth(-1)" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold">◀</button>
        <button onclick="changeCalendarMonth(1)" class="p-1.5 rounded-lg border border-slate-200 dark:border-slate-700 hover:bg-slate-100 dark:hover:bg-slate-800 text-xs font-bold">▶</button>
      </div>
    </div>
    <div class="grid grid-cols-7 gap-1 text-center text-[11px] font-bold text-slate-400 mb-1.5">
      ${weekdays.map(w => `<div>${w}</div>`).join('')}
    </div>
    <div class="grid grid-cols-7 gap-1.5">
      ${cellsHtml}
    </div>
    <div class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-[11px] text-slate-500">
      <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-indigo-500 inline-block"></span> 藍底日期有收錄新聞（點擊直達當日詞彙表）</span>
    </div>
  `;
}

// C. View 2: Daily News Vocab View (Replaced date pills with Mini Calendar + Home icon beside major title)
function renderDailyView() {
  const dayObj = state.db[state.selectedDate] || state.db[state.availableDates[0]];

  const presentTopicIds = [...new Set(items.map(i => i.topic_id))];

      ${presentTopicIds.map(tid => {

        }">🗓️ 日期 ▾</button>

  const dayNavBtn = (date, label, align) => date ? `

      <span class="text-sm font-extrabold">📅 ${date}</span>

    </button>` : `
    <div class="flex-1 min-w-0 flex flex-col ${align === 'right' ? 'items-end text-right' : 'items-start text-left'} justify-center px-4 py-3 rounded-2xl border border-dashed border-slate-200 dark:border-slate-800 text-xs text-slate-400">

function toggleCalendarPopover() {
  state.calendarOpen = !state.calendarOpen;
  if (state.calendarOpen) state.calendarMonth = (state.selectedDate || state.calendarMonth).slice(0, 7);
  renderMainContent();
}

function goToAdjacentDay(dateStr) {
  openDateVocab(dateStr);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 點擊月曆以外的地方時收起月曆
document.addEventListener('click', e => {
  if (!state.calendarOpen) return;
  if (!document.body.contains(e.target)) return; // 月份切換後元素已重繪
  if (e.target.closest('#cal-wrap')) return;
  state.calendarOpen = false;
  if (state.activeTab === 'daily') renderMainContent();
});

// F. View 5 & 6: Separate Mastered Page & Review (溫習詞彙) Page
// Requirement #5: "全部語境分類" occupies its own full row first, followed by a new row starting "1. 教育與學習" with 5 categories per row!
// Requirement #6: Renamed to "溫習詞彙"
function renderPersonalVocabPage(mode) {
  const isMasteredPage = mode === 'mastered_page';
  const activeTopic = isMasteredPage ? state.masteredPageTopic : state.reviewPageTopic;
  const activeLetter = isMasteredPage ? state.masteredPageLetter : state.reviewPageLetter;

  const allItems = getAllItemsFlattened();
  const seen = new Set();
  const uniqueItems = [];
  for (const it of allItems) {
    const k = it.word.toLowerCase().trim();
    if (!seen.has(k)) {
      seen.add(k);
      uniqueItems.push(it);
    }
  }

  let baseList = uniqueItems.filter(it => {
    const k = it.word.toLowerCase().trim();
    return isMasteredPage ? !!state.mastered[k] : !!state.unfamiliar[k];
  });

  const totalBaseCount = baseList.length;

  if (activeTopic !== 'all') {
    baseList = baseList.filter(it => it.topic_id === Number(activeTopic));
  }
  if (activeLetter !== 'ALL') {

  // Row 1: "全部語境分類" standalone full-width row
  const allCategoryRowHtml = `

        activeTopic === 'all'
          ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
          : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-indigo-400'
      }">
        <span class="text-xs font-extrabold">📚 全部語境分類</span>
        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${activeTopic === 'all' ? 'bg-white/20 text-white' : 'bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${totalBaseCount} 字</span>
      </button>
    </div>
  `;

  // Row 2+: 20 categories arranged strictly 5 per row on desktop (grid-cols-2 sm:grid-cols-3 md:grid-cols-5)
  const twentyCategoriesGridHtml = `
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
      ${IELTS_20_TOPICS.map(t => {
        const cnt = uniqueItems.filter(it => {
          const k = it.word.toLowerCase().trim();
          const inBucket = isMasteredPage ? !!state.mastered[k] : !!state.unfamiliar[k];
          return inBucket && it.topic_id === t.id;
        }).length;
        const selected = String(activeTopic) === String(t.id);
        return `
          <button onclick="${isMasteredPage ? `setMasteredPageTopic(${t.id})` : `setReviewPageTopic(${t.id})`}" class="p-2.5 rounded-xl border text-left transition flex items-center justify-between gap-1.5 min-w-0 ${
            selected
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
              : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-indigo-400'
          }">
            <span class="text-xs font-bold leading-snug break-words">${t.icon} ${t.id}.${t.name}</span>
            <span class="text-[11px] font-bold px-1.5 py-0.5 rounded-full shrink-0 ${
              selected ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'
            }">${cnt}</span>
          </button>
        `;
      }).join('')}
    </div>
  `;

  return `
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-2xs space-y-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <span class="text-xs font-bold uppercase tracking-wider ${isMasteredPage ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'}">
            ${isMasteredPage ? '學習成就詞庫' : '重點強化單字本'}
          </span>
          <div class="flex items-center gap-2 mt-0.5 flex-wrap">
            <h2 class="text-lg font-extrabold">
              ${isMasteredPage ? `✅ 已掌握詞彙（共 ${totalBaseCount} 字）` : `📌 溫習詞彙（共 ${totalBaseCount} 字）`}
            </h2>
            ${renderHomeBtn()}
          </div>
        </div>
        <button onclick="switchTab('${isMasteredPage ? 'review_page' : 'mastered_page'}')" class="px-3.5 py-2 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 transition">
          ${isMasteredPage ? '切換至「溫習詞彙」→' : '切換至「已掌握詞彙」→'}
        </button>
      </div>

      <!-- IELTS 20 Context Category Filter -->
      <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
        <div class="text-xs font-bold text-slate-500 mb-2">按 IELTS 20 語境分類瀏覽跨日新聞詞彙：</div>
        ${allCategoryRowHtml}
        ${twentyCategoriesGridHtml}
      </div>

      <!-- A-Z Filter -->
      <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
        ${renderAZButtons(activeLetter, isMasteredPage ? 'setMasteredPageLetter' : 'setReviewPageLetter')}
      </div>
    </div>

    ${renderVocabCollection(baseList, {
      showDateBadge: true,
      emptyMsg: isMasteredPage
        ? '目前此篩選條件下沒有「已掌握」詞彙，在每日新聞中點擊「✓ 已掌握」即可加入！'
        : '目前此篩選條件下沒有「溫習詞彙」，在每日新聞中點擊「☆ 未熟練」即可加入重點複習！'
    })}

}

// G. View 7: Word Frequency Statistics
function renderFrequencyView() {
  const allStats = getUniqueWordStats().sort((a, b) => b.count - a.count || a.word.localeCompare(b.word));

  let filtered = allStats;
  if (state.freqTopic !== 'all') {
    filtered = filtered.filter(s => s.topic_id === Number(state.freqTopic));
  }
  if (state.freqLetter !== 'ALL') {
    filtered = filtered.filter(s => s.word.toUpperCase().startsWith(state.freqLetter));
  }

  const pageSize = 50;
  const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
  if (state.freqPage > totalPages) state.freqPage = totalPages;
  if (state.freqPage < 1) state.freqPage = 1;

  const startIdx = (state.freqPage - 1) * pageSize;
  const pageSlice = filtered.slice(startIdx, startIdx + pageSize);

  const topicButtonsHtml = `
    <div class="mb-2.5">
      <button onclick="setFreqTopic('all')" class="w-full sm:w-auto min-w-[220px] px-4 py-2.5 rounded-xl border text-left transition flex items-center justify-between gap-3 ${
        state.freqTopic === 'all'
          ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
          : 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 hover:border-indigo-400'
      }">
        <span class="text-xs font-extrabold">📚 全部 20 語境</span>
        <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full ${state.freqTopic === 'all' ? 'bg-white/20 text-white' : 'bg-white dark:bg-slate-700 text-slate-600 dark:text-slate-300'}">${allStats.length} 字</span>
      </button>
    </div>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-2">
      ${IELTS_20_TOPICS.map(t => {
        const cnt = allStats.filter(s => s.topic_id === t.id).length;
        const selected = String(state.freqTopic) === String(t.id);
        return `
          <button onclick="setFreqTopic(${t.id})" class="p-2.5 rounded-xl border text-left transition flex items-center justify-between gap-1.5 min-w-0 ${
            selected
              ? 'bg-indigo-600 text-white border-indigo-600 shadow-2xs'
              : 'bg-white dark:bg-slate-900 border-slate-200 dark:border-slate-800 hover:border-indigo-400'
          }">
            <span class="text-xs font-bold leading-snug break-words">${t.icon} ${t.id}.${t.name}</span>
            <span class="text-[11px] font-bold px-1.5 py-0.5 rounded-full shrink-0 ${
              selected ? 'bg-white/20 text-white' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400'
            }">${cnt}</span>
          </button>
        `;
      }).join('')}
    </div>
  `;

  const rows = pageSlice.map(s => {
    const topicObj = TOPIC_MAP[s.topic_id] || { icon: '📌', name: '綜合' };
    return `
      <tr class="border-b border-slate-100 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800/40 transition">
        <!-- Col 1: 重複次數 -->
        <td class="py-3 px-3 w-[12%]">
          <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-extrabold ${
            s.count >= 2
              ? 'bg-rose-100 dark:bg-rose-950 text-rose-700 dark:text-rose-300'
              : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300'
          }">
            ${s.count} 次
          </span>
        </td>

        <!-- Col 2: 英文原字 -->
        <td class="py-3 px-3 w-[25%] break-words">
          <div class="flex items-center gap-1.5 flex-wrap">
            <span class="font-extrabold text-sm text-slate-900 dark:text-white break-words">${escapeHtml(s.word)}</span>
            <button onclick="speakText('${escapeHtml(s.word)}')" class="text-xs p-1 rounded bg-indigo-50 dark:bg-indigo-950 text-indigo-600 dark:text-indigo-300 shrink-0" title="朗讀單字">🔊</button>
            <span class="pos-tag text-[11px] text-slate-500">${escapeHtml(s.pos)}</span>
          </div>
        </td>

        <!-- Col 3: 中文意思 -->
        <td class="py-3 px-3 w-[25%] text-xs font-semibold text-slate-700 dark:text-slate-200 break-words">${escapeHtml(s.zh)}</td>

        <!-- Col 4: 語境 -->
        <td class="py-3 px-3 w-[20%] text-xs">
          <span class="inline-block px-2.5 py-0.5 rounded-full bg-indigo-50 dark:bg-indigo-950 text-indigo-700 dark:text-indigo-300 font-semibold">
            ${topicObj.icon} ${topicObj.name}
          </span>
        </td>

        <!-- Col 5: 出現新聞日期 (只顯示最新出現日期) -->
        <td class="py-3 px-3 w-[18%]">
          <button onclick="openDateVocab('${s.latestDate}')" class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-indigo-100 dark:hover:bg-indigo-900 text-xs font-mono font-bold text-indigo-600 dark:text-indigo-300 transition" title="點擊跳轉至該日新聞詞彙表">
            📅 ${s.latestDate}
          </button>
        </td>
      </tr>

  }).join('');

  return `
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-2xs space-y-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">跨日高頻新聞詞彙分析（每頁最多 50 筆）</span>
        <div class="flex items-center gap-2 mt-0.5 flex-wrap">
          <h2 class="text-lg font-extrabold">📊 字詞重複次數統計（共 ${filtered.length} 個不重複詞彙）</h2>
          ${renderHomeBtn()}
        </div>
      </div>

      <!-- 20 Context Category Buttons Before A-Z -->
      <div class="pt-2 border-t border-slate-100 dark:border-slate-800">
        <div class="text-xs font-bold text-slate-500 mb-2">1. 先選擇 IELTS 20 語境分類：</div>
        ${topicButtonsHtml}
      </div>

      <!-- A-Z Filter -->
      <div class="pt-3 border-t border-slate-100 dark:border-slate-800">
        ${renderAZButtons(state.freqLetter, 'setFreqLetter')}
      </div>
    </div>

    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xs overflow-hidden">
      <div class="w-full overflow-x-auto">
        <table class="w-full table-fixed text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 dark:bg-slate-800/80 border-b border-slate-200 dark:border-slate-800 text-xs font-bold text-slate-500 uppercase">
              <th class="py-3 px-3 w-[12%]">重複次數</th>
              <th class="py-3 px-3 w-[25%]">英文原字</th>
              <th class="py-3 px-3 w-[25%]">中文意思</th>
              <th class="py-3 px-3 w-[20%]">語境</th>
              <th class="py-3 px-3 w-[18%]">出現新聞日期（最新）</th>
            </tr>
          </thead>
          <tbody>
            ${rows || `<tr><td colspan="5" class="py-8 text-center text-sm text-slate-500">目前篩選條件下暫無收錄詞彙。</td></tr>`}
          </tbody>
        </table>
      </div>
    </div>

    ${renderPaginationBar(state.freqPage, totalPages, 'setFreqPage')}
  `;
}

// H. View 8: News Headline Keyword Search (Max 10 per page + Prev/Next)
function renderSearchView() {
  const q = state.searchQuery.trim().toLowerCase();
  const matchedDays = state.availableDates.filter(d => {
    if (!q) return true;
    const dayObj = state.db[d];
    const inHeadlines = (dayObj?.headlines || []).some(h => h.toLowerCase().includes(q));
    const inWords = (dayObj?.items || []).some(it =>
      it.word.toLowerCase().includes(q) || it.zh.toLowerCase().includes(q)
    );
    return inHeadlines || inWords;
  });

  const pageSize = 10;
  const totalPages = Math.max(1, Math.ceil(matchedDays.length / pageSize));
  if (state.searchPage > totalPages) state.searchPage = totalPages;
  if (state.searchPage < 1) state.searchPage = 1;

  const startIdx = (state.searchPage - 1) * pageSize;
  const pageDays = matchedDays.slice(startIdx, startIdx + pageSize);

  return `
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-2xs space-y-4">
      <div>
        <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">全庫檢索（每頁最多顯示 10 集）</span>
        <div class="flex items-center gap-2 mt-0.5 flex-wrap">
          <h2 class="text-lg font-extrabold">🔍 新聞標題關鍵字搜尋（支援中文或英文關鍵字）</h2>
          ${renderHomeBtn()}
        </div>
      </div>
      <div class="flex gap-2">
        <input
          id="headline-search-input"
          type="text"
          value="${escapeHtml(state.searchQuery)}"
          oninput="updateSearchQuery(this.value)"
          placeholder="輸入新聞標題或詞彙關鍵字，例如：北部都會區、AI、inflation、climate、醫療..."
          class="flex-1 min-w-0 px-4 py-2.5 rounded-xl border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
        ${state.searchQuery ? `<button onclick="updateSearchQuery('')" class="px-4 py-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-xs font-bold hover:bg-slate-100 dark:hover:bg-slate-800 shrink-0">清除</button>` : ''}
      </div>
    </div>

    <div class="space-y-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="text-xs font-bold text-slate-500">找到 ${matchedDays.length} 集相關新聞節目</div>
        <div class="inline-flex rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-900 p-0.5 shadow-2xs" role="group" aria-label="檢視方式">
          ${[['grid', '並排檢視', '<path stroke-linecap="round" stroke-linejoin="round" d="M4 5h6v6H4zM14 5h6v6h-6zM4 15h6v4H4zM14 15h6v4h-6z"/>'],
             ['list', '清單檢視', '<path stroke-linecap="round" stroke-linejoin="round" d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>']].map(([mode, label, icon]) => {
            const on = state.searchView === mode;
            return `<button onclick="setSearchView('${mode}')" aria-pressed="${on}" title="${label}"
              class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-xs font-bold transition ${on ? 'bg-indigo-600 text-white shadow-2xs' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">${icon}</svg>${label}
            </button>`;
          }).join('')}
        </div>
      </div>
      ${state.searchView === 'list' ? renderSearchList(pageDays, q) : `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 items-start">
      ${pageDays.map(d => {
        const dayObj = state.db[d];
        return `
          <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-5 shadow-2xs space-y-3 min-w-0">
            <div class="flex items-center justify-between gap-2 flex-wrap">
              <h3 class="text-base font-extrabold text-indigo-600 dark:text-indigo-400">📅 ${d}《TVB News at 7:30》</h3>
              <button onclick="openDateVocab('${d}')" class="px-3.5 py-1.5 rounded-xl bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition">
                檢視當日 ${dayObj.items.length} 個詞彙 →
              </button>
            </div>
            <ul class="space-y-2 text-sm">
              ${(dayObj.headlines || []).map(h => {
                const isHit = q && h.toLowerCase().includes(q);
                return `
                  <li class="p-2.5 rounded-xl ${isHit ? 'bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800' : 'bg-slate-50/70 dark:bg-slate-800/40'}">
                    ${formatBilingualHeadline(h)}
                  </li>
                `;
              }).join('')}
            </ul>
          </div>
        `;
      }).join('')}
      </div>`}
    </div>

    ${renderPaginationBar(state.searchPage, totalPages, 'setSearchPage')}
  `;
}

// 搜尋結果：清單檢視（每集一行，標題逐條列出，較緊湊）
function renderSearchList(pageDays, q) {
  if (!pageDays.length) return '';
  return `
    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xs divide-y divide-slate-100 dark:divide-slate-800">
      ${pageDays.map(d => {
        const dayObj = state.db[d];
        return `
          <div class="p-4 flex flex-col sm:flex-row sm:items-start gap-2 sm:gap-4">
            <div class="sm:w-40 shrink-0 flex sm:flex-col items-center sm:items-start justify-between gap-2">
              <span class="text-sm font-extrabold text-indigo-600 dark:text-indigo-400 whitespace-nowrap">📅 ${d}</span>
              <button onclick="openDateVocab('${d}')" class="px-2.5 py-1 rounded-lg bg-indigo-600 text-white text-[11px] font-bold hover:bg-indigo-700 transition whitespace-nowrap">
                ${dayObj.items.length} 個詞彙 →
              </button>
            </div>
            <ol class="flex-1 min-w-0 space-y-1 text-sm list-decimal list-inside marker:text-slate-400">
              ${(dayObj.headlines || []).map(h => {
                const isHit = q && h.toLowerCase().includes(q);
                const mm = String(h).match(/^(.*?)\s*\(([^()]+)\)\s*$/);
                const zh = mm ? mm[1].trim() : String(h);
                const en = mm ? mm[2].trim() : '';
                return `<li class="truncate ${isHit ? 'text-amber-700 dark:text-amber-300' : 'text-slate-700 dark:text-slate-200'}" title="${escapeHtml(h)}"><span class="${isHit ? 'font-extrabold' : 'font-semibold'}">${escapeHtml(zh)}</span>${en ? ` <span class="text-xs font-normal text-slate-400 dark:text-slate-500">${escapeHtml(en)}</span>` : ''}</li>`;
              }).join('')}
            </ol>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

function setSearchView(mode) {
  state.searchView = mode === 'list' ? 'list' : 'grid';
  saveState();
  if (state.activeTab === 'search') {
    const main = document.getElementById('main-content');
    if (main) main.innerHTML = renderSearchView(); else renderAll();
  }
}

// ==================== 8. INTERACTION HANDLERS ====================
function switchTab(tabId) {
  state.activeTab = tabId;
  closeMobileSidebar();
  renderAll();
}

function openDateVocab(dateStr) {
  state.selectedDate = dateStr;
  state.calendarOpen = false;
  state.calendarMonth = dateStr.slice(0, 7);
  state.selectedTopic = 'all';
  state.activeTab = 'daily';
  closeMobileSidebar();
  renderAll();
}

function setTopicFilter(tid) {
  state.selectedTopic = tid;
  renderMainContent();
}

function selectContextTopic(tid) {
  state.topicsPageTopic = tid;
  renderMainContent();
}

function setTopicsPageLetter(letter) {
  state.topicsPageLetter = letter;
  renderMainContent();
}

function setArchiveViewMode(mode) {
  state.archiveViewMode = mode;
  renderMainContent();
}

function setArchivePage(page) {
  state.archivePage = page;
  renderMainContent();
}

function setMasteredPageTopic(tid) {
  state.masteredPageTopic = tid;
  renderMainContent();
}

function setMasteredPageLetter(letter) {
  state.masteredPageLetter = letter;
  renderMainContent();
}

function setReviewPageTopic(tid) {
  state.reviewPageTopic = tid;
  renderMainContent();
}

function setReviewPageLetter(letter) {
  state.reviewPageLetter = letter;
  renderMainContent();
}

function setFreqTopic(tid) {
  state.freqTopic = tid;
  state.freqPage = 1;
  renderMainContent();
}

function setFreqLetter(letter) {
  state.freqLetter = letter;
  state.freqPage = 1;
  renderMainContent();
}

function setFreqPage(page) {
  state.freqPage = page;
  renderMainContent();
}

function setSearchPage(page) {
  state.searchPage = page;
  renderMainContent();
}

function setViewMode(mode) {
  state.viewMode = mode;
  renderMainContent();
}

function toggleGlobalMask() {
  state.globalMask = !state.globalMask;
  state.rowRevealed = {};
  showToast(state.globalMask ? '🙈 已開啟全部中文遮罩自測模式' : '👁️ 已解除全部遮罩');
  renderMainContent();
}

function toggleSingleBlur(uid) {
  state.rowRevealed[uid] = !state.rowRevealed[uid];
  renderMainContent();
}

function changeCalendarMonth(delta) {
  const [y, m] = state.calendarMonth.split('-').map(Number);
  const dt = new Date(y, m - 1 + delta, 1);
  state.calendarMonth = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
  renderMainContent();
}

function updateSearchQuery(val) {
  state.searchQuery = val;
  state.searchPage = 1;
  renderMainContent();
  const inp = document.getElementById('headline-search-input');
  if (inp) {
    inp.focus();
    inp.setSelectionRange(val.length, val.length);
  }
}

function renderMainContent() {
  const main = document.getElementById('main-content');
  if (state.activeTab === 'dashboard') main.innerHTML = renderDashboardView();
  else if (state.activeTab === 'daily') main.innerHTML = renderDailyView();
  else if (state.activeTab === 'topics') main.innerHTML = renderTopicsView();
  else if (state.activeTab === 'archive') main.innerHTML = renderArchiveView();
  else if (state.activeTab === 'mastered_page') main.innerHTML = renderPersonalVocabPage('mastered_page');
  else if (state.activeTab === 'review_page') main.innerHTML = renderPersonalVocabPage('review_page');
  else if (state.activeTab === 'frequency') main.innerHTML = renderFrequencyView();
  else if (state.activeTab === 'search') main.innerHTML = renderSearchView();
}

function renderAll() {
  updateTopBarControls();
  renderSidebar();
  renderMainContent();
}

// ==================== 9. GLOBAL EVENT LISTENERS & BACKUP MODAL ====================
function closeMobileSidebar() {
  const sidebar = document.getElementById('sidebar');
  const backdrop = document.getElementById('mobile-backdrop');
  sidebar.classList.add('-translate-x-full');
  backdrop.classList.add('hidden');
}

document.getElementById('sidebar-toggle').addEventListener('click', () => {
  if (window.innerWidth < 1024) {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('mobile-backdrop').classList.toggle('hidden');
  } else {
    state.sidebarCollapsed = !state.sidebarCollapsed;
    saveState();
    updateTopBarControls();
  }
});

document.getElementById('sidebar-close-mobile').addEventListener('click', closeMobileSidebar);
document.getElementById('mobile-backdrop').addEventListener('click', closeMobileSidebar);

document.getElementById('btn-accent-uk').addEventListener('click', () => {
  state.accent = 'uk';
  saveState();
  updateTopBarControls();
  showToast('🇬🇧 已切換為英式發音 (UK)');
});

document.getElementById('btn-accent-us').addEventListener('click', () => {
  state.accent = 'us';
  saveState();
  updateTopBarControls();
  showToast('🇺🇸 已切換為美式發音 (US)');
});

document.getElementById('btn-speed').addEventListener('click', () => {
  const speeds = [1.0, 0.8, 1.2];
  const next = speeds[(speeds.indexOf(state.speed) + 1) % speeds.length];
  state.speed = next;
  saveState();
  updateTopBarControls();
  showToast(`語音朗讀速度：${next.toFixed(1)}x`);
});

document.getElementById('btn-font-size').addEventListener('click', () => {
  const sizes = ['normal', 'large', 'xlarge'];
  state.fontSize = sizes[(sizes.indexOf(state.fontSize) + 1) % sizes.length];
  saveState();
  updateTopBarControls();
  renderMainContent();
});

document.getElementById('btn-theme').addEventListener('click', () => {
  state.darkMode = !state.darkMode;
  saveState();
  updateTopBarControls();
});

const backupModal = document.getElementById('backup-modal');
document.getElementById('btn-backup').addEventListener('click', () => {
  const mCount = Object.keys(state.mastered).length;
  const uCount = Object.keys(state.unfamiliar).length;
  document.getElementById('backup-summary').innerHTML = `
    目前本機學習紀錄：已掌握 <strong class="text-emerald-600">${mCount}</strong> 個單字，溫習詞彙 <strong class="text-amber-600">${uCount}</strong> 個單字。
  `;
  backupModal.classList.remove('hidden');
  backupModal.classList.add('flex');
});

document.getElementById('backup-modal-close').addEventListener('click', () => {
  backupModal.classList.add('hidden');
  backupModal.classList.remove('flex');
});

document.getElementById('btn-export-file').addEventListener('click', () => {
  const payload = JSON.stringify({ mastered: state.mastered, unfamiliar: state.unfamiliar, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `tvb_730_vocab_backup_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('⬇️ 已下載學習進度備份檔');
});

document.getElementById('btn-copy-code').addEventListener('click', async () => {
  const payload = JSON.stringify({ mastered: state.mastered, unfamiliar: state.unfamiliar });
  try {
    await navigator.clipboard.writeText(payload);
    showToast('📋 已複製進度代碼到剪貼簿');
  } catch (_) {
    showToast('請手動從下載檔案備份');
  }
});

function applyImportedPayload(rawText) {
  try {
    const data = JSON.parse(rawText);
    if (data.mastered && typeof data.mastered === 'object') state.mastered = data.mastered;
    if (data.unfamiliar && typeof data.unfamiliar === 'object') state.unfamiliar = data.unfamiliar;
    saveState();
    renderAll();
    document.getElementById('backup-status').textContent = '✅ 匯入成功！';
    showToast('✅ 學習進度已成功還原');
  } catch (e) {
    document.getElementById('backup-status').textContent = '❌ 格式錯誤，請確認 JSON 代碼完整。';
  }
}

document.getElementById('btn-import-code').addEventListener('click', () => {
  const code = document.getElementById('backup-code-input').value.trim();
  if (code) applyImportedPayload(code);
});

document.getElementById('backup-file-input').addEventListener('change', (e) => {
  const file = e.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => applyImportedPayload(reader.result);
  reader.readAsText(file);
});

// ==================== 10. INIT ====================
loadState();
renderAll();
tryLoadExternalData();
if ('speechSynthesis' in window) {
  window.speechSynthesis.getVoices();
}
</script>
</body>
</html>
